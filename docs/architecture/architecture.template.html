<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading Clipper system architecture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; }
    body { display: grid; place-items: center; }
    svg { display: block; width: min(100%, 1600px); height: auto; background: #fff; }
  </style>
</head>
<body>
<!-- DIAGRAM_SVG_START -->
<svg id="architecture-diagram" xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Reading Clipperのシステム構成</title>
  <desc id="diagram-desc">利用者とSlackからCloudflare上の単一Workerへ入り、Queue、Durable Object、D1を利用しながら、AI Gateway経由でGeminiを呼び出し、記事を取得してGitHubへ保存する静的構成図。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-start" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M7,0 L0,3.5 L7,7 Z" fill="#475569"/>
    </marker>
    <style>
      .node { fill: #fff; stroke: #64748b; stroke-width: 2; }
      .boundary { fill: #f8fafc; fill-opacity: .42; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 7; }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; }
      .flow { fill: none; stroke: #475569; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: square; marker-end: url(#arrow); }
      .flow-both { fill: none; stroke: #475569; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: square; marker-start: url(#arrow-start); marker-end: url(#arrow); }
      .node-title { font: 600 24px "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif; fill: #0f172a; }
      .node-detail { font: 400 17px "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif; fill: #475569; }
      .role-title { font: 600 22px "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif; fill: #0f172a; }
      .role-detail { font: 400 17px "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif; fill: #475569; }
      .boundary-title { font: 600 21px "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif; fill: #334155; }
      .flow-label { font: 500 16px "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif; fill: #475569; paint-order: stroke; stroke: #fff; stroke-width: 8; stroke-linejoin: round; }
      .generic-icon { fill: none; stroke: #475569; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>
  <rect width="1600" height="10" fill="#2563eb"/>

  <!-- Connectors are intentionally behind all nodes. -->
  <polyline class="flow" points="190,330 230,330"/>
  <polyline class="flow-both" points="410,330 500,330"/>
  <polyline class="flow-both" points="910,300 935,300 935,180 960,180"/>
  <polyline class="flow" points="1050,225 1050,250"/>
  <polyline class="flow" points="910,340 1260,340"/>
  <polyline class="flow" points="910,520 950,520"/>
  <polyline class="flow" points="1140,520 1260,520"/>
  <polyline class="flow" points="910,645 950,645"/>
  <polyline class="flow" points="820,710 820,772 950,772"/>
  <polyline class="flow" points="910,700 1225,700 1225,740 1260,740"/>

  <text class="flow-label" x="455" y="310" text-anchor="middle">イベント / 投稿</text>
  <text class="flow-label" x="1180" y="322" text-anchor="middle">URL取得</text>
  <text class="flow-label" x="1200" y="502" text-anchor="middle">AI呼び出し</text>
  <text class="flow-label" x="1080" y="724" text-anchor="middle">Markdown保存</text>

  <!-- Primary user -->
  <g data-node="user" transform="translate(40 240)">
    <rect class="node" width="150" height="180" rx="6"/>
    <circle class="generic-icon" cx="75" cy="50" r="22"/>
    <path class="generic-icon" d="M40 112 C43 78,107 78,110 112"/>
    <text class="node-title" x="75" y="145" text-anchor="middle">利用者</text>
    <text class="node-detail" x="75" y="168" text-anchor="middle">スマートフォン等</text>
  </g>

  <!-- Slack -->
  <g data-node="slack" transform="translate(230 220)">
    <rect class="node" width="180" height="220" rx="6"/>
    <image href="{{SLACK_DATA_URI}}" x="58" y="26" width="64" height="64" preserveAspectRatio="xMidYMid meet"/>
    <text class="node-title" x="90" y="126" text-anchor="middle">Slack</text>
    <text class="node-detail" x="90" y="155" text-anchor="middle">Bot DM・スレッド</text>
    <text class="node-detail" x="90" y="182" text-anchor="middle">要約・週次通知</text>
  </g>

  <!-- Cloudflare account boundary -->
  <g data-boundary="cloudflare-account">
    <rect class="boundary" x="450" y="65" width="760" height="770" rx="6"/>
    <image href="{{CLOUDFLARE_DATA_URI}}" x="478" y="88" width="145" height="49" preserveAspectRatio="xMidYMid meet"/>
    <text class="boundary-title" x="640" y="120">Cloudflare account</text>
  </g>

  <!-- One deployable Worker with three responsibilities -->
  <g data-node="application-worker" transform="translate(500 160)">
    <rect class="node" width="410" height="550" rx="6"/>
    <image href="{{WORKERS_DATA_URI}}" x="75" y="25" width="45" height="46" preserveAspectRatio="xMidYMid meet"/>
    <text class="node-title" x="235" y="50" text-anchor="middle">アプリケーションWorker</text>
    <text class="node-detail" x="235" y="80" text-anchor="middle">1つのデプロイ</text>
    <line class="divider" x1="28" y1="110" x2="382" y2="110"/>

    <g transform="translate(42 143)">
      <path class="generic-icon" d="M0 15 H30 M21 6 L30 15 L21 24"/>
      <text class="role-title" x="55" y="12">Slack受付</text>
      <text class="role-detail" x="55" y="40">署名・利用者検証、即時ACK</text>
    </g>

    <line class="divider" x1="28" y1="215" x2="382" y2="215"/>
    <g transform="translate(42 250)">
      <path class="generic-icon" d="M2 7 H28 V25 H2 Z M8 1 H34 V19"/>
      <text class="role-title" x="55" y="12">非同期処理</text>
      <text class="role-detail" x="55" y="40">本文取得・要約・GitHub保存</text>
    </g>

    <line class="divider" x1="28" y1="325" x2="382" y2="325"/>
    <g transform="translate(42 370)">
      <rect class="generic-icon" x="1" y="3" width="31" height="27" rx="3"/>
      <path class="generic-icon" d="M1 11 H32 M9 0 V7 M24 0 V7"/>
      <text class="role-title" x="55" y="12">週次通知</text>
      <text class="role-detail" x="55" y="40">未Dismissクリップのダイジェスト</text>
    </g>
  </g>

  <!-- Cloudflare resources bound to the Worker -->
  <g data-node="queue" transform="translate(960 135)">
    <rect class="node" width="180" height="90" rx="6"/>
    <image href="{{QUEUES_DATA_URI}}" x="20" y="23" width="44" height="44" preserveAspectRatio="xMidYMid meet"/>
    <text class="node-title" x="112" y="39" text-anchor="middle">Queue</text>
    <text class="node-detail" x="112" y="66" text-anchor="middle">非同期化</text>
  </g>

  <g data-node="dead-letter-queue" transform="translate(990 250)">
    <rect class="node" width="120" height="65" rx="6"/>
    <path class="generic-icon" d="M18 43 L32 17 L46 43 Z M32 25 V34 M32 39 V40"/>
    <text class="node-title" x="82" y="40" text-anchor="middle">DLQ</text>
  </g>

  <g data-node="ai-gateway" transform="translate(950 465)">
    <rect class="node" width="190" height="110" rx="6"/>
    <image href="{{AI_GATEWAY_DATA_URI}}" x="14" y="34" width="42" height="42" preserveAspectRatio="xMidYMid meet"/>
    <text class="node-title" x="126" y="47" text-anchor="middle" style="font-size:22px">AI Gateway</text>
    <text class="node-detail" x="126" y="76" text-anchor="middle">認証・ログ</text>
  </g>

  <g data-node="conversation-history" transform="translate(950 600)">
    <rect class="node" width="190" height="90" rx="6"/>
    <image href="{{DURABLE_OBJECTS_DATA_URI}}" x="18" y="19" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>
    <text class="node-title" x="126" y="38" text-anchor="middle">会話履歴</text>
    <text class="node-detail" x="126" y="66" text-anchor="middle">Durable Object</text>
  </g>

  <g data-node="clip-state" transform="translate(950 735)">
    <rect class="node" width="190" height="75" rx="6"/>
    <image href="{{D1_DATA_URI}}" x="14" y="16" width="42" height="42" preserveAspectRatio="xMidYMid meet"/>
    <text class="node-title" x="126" y="32" text-anchor="middle" style="font-size:22px">クリップ状態</text>
    <text class="node-detail" x="126" y="58" text-anchor="middle">D1</text>
  </g>

  <!-- External dependencies -->
  <g data-node="content-sources" transform="translate(1260 265)">
    <rect class="node" width="290" height="150" rx="6"/>
    <circle class="generic-icon" cx="145" cy="43" r="25"/>
    <path class="generic-icon" d="M120 43 H170 M145 18 C134 29 134 57 145 68 M145 18 C156 29 156 57 145 68"/>
    <text class="node-title" x="145" y="103" text-anchor="middle">記事・ドキュメント</text>
    <text class="node-detail" x="145" y="132" text-anchor="middle">URL別に内容を取得</text>
  </g>

  <g data-node="gemini" transform="translate(1260 450)">
    <rect class="node" width="290" height="160" rx="6"/>
    <image href="{{GEMINI_DATA_URI}}" x="113" y="18" width="64" height="64" preserveAspectRatio="xMidYMid meet"/>
    <text class="node-title" x="145" y="108" text-anchor="middle">Gemini</text>
    <text class="node-detail" x="145" y="137" text-anchor="middle">要約・会話</text>
  </g>

  <g data-node="github" transform="translate(1260 650)">
    <rect class="node" width="290" height="180" rx="6"/>
    <g transform="translate(113 20) scale(.65)">
      <path d="M41.4395 69.3848C28.8066 67.8535 19.9062 58.7617 19.9062 46.9902C19.9062 42.2051 21.6289 37.0371 24.5 33.5918C23.2559 30.4336 23.4473 23.7344 24.8828 20.959C28.7109 20.4805 33.8789 22.4902 36.9414 25.2656C40.5781 24.1172 44.4062 23.543 49.0957 23.543C53.7852 23.543 57.6133 24.1172 61.0586 25.1699C64.0254 22.4902 69.2891 20.4805 73.1172 20.959C74.457 23.543 74.6484 30.2422 73.4043 33.4961C76.4668 37.1328 78.0937 42.0137 78.0937 46.9902C78.0937 58.7617 69.1934 67.6621 56.3691 69.2891C59.623 71.3945 61.8242 75.9883 61.8242 81.252L61.8242 91.2051C61.8242 94.0762 64.2168 95.7031 67.0879 94.5547C84.4102 87.9512 98 70.6289 98 49.1914C98 22.1074 75.9883 6.69539e-07 48.9043 4.309e-07C21.8203 1.92261e-07 -1.9479e-07 22.1074 -4.3343e-07 49.1914C-6.20631e-07 70.4375 13.4941 88.0469 31.6777 94.6504C34.2617 95.6074 36.75 93.8848 36.75 91.3008L36.75 83.6445C35.4102 84.2188 33.6875 84.6016 32.1562 84.6016C25.8398 84.6016 22.1074 81.1563 19.4277 74.7441C18.375 72.1602 17.2266 70.6289 15.0254 70.3418C13.877 70.2461 13.4941 69.7676 13.4941 69.1934C13.4941 68.0449 15.4082 67.1836 17.3223 67.1836C20.0977 67.1836 22.4902 68.9063 24.9785 72.4473C26.8926 75.2227 28.9023 76.4668 31.2949 76.4668C33.6875 76.4668 35.2187 75.6055 37.4199 73.4043C39.0469 71.7773 40.291 70.3418 41.4395 69.3848Z" fill="#000"/>
    </g>
    <text class="node-title" x="145" y="119" text-anchor="middle">GitHub</text>
    <text class="node-detail" x="145" y="148" text-anchor="middle">privateクリップ保存先</text>
  </g>
</svg>
<!-- DIAGRAM_SVG_END -->
</body>
</html>
