name: Code Search installation-token smoke

on:
  push:
    branches: [feat/github-code-search]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Prove GITHUB_TOKEN is an installation token
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api installation/repositories --silent

      - name: Search code with the same installation token
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          count="$(gh api -X GET search/code \
            -f q="Reading Clipper repo:${GITHUB_REPOSITORY}" \
            -H 'Accept: application/vnd.github.text-match+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --jq '.total_count')"
          test "$count" -gt 0
