name: Agent docs sync

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent-docs-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify instruction files are identical
        shell: bash
        run: cmp --silent AGENTS.md CLAUDE.md

