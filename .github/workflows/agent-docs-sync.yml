name: Agent docs sync

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent-docs-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify instruction files are identical
        shell: bash
        run: cmp --silent AGENTS.md CLAUDE.md

