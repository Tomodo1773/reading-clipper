name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpmのバージョンは package.json の packageManager を参照する。
      # CI側に別途書いて二重管理しない。
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      # --frozen-lockfile でCIがlockfileを変更しないことを保証する。
      - name: Install dependencies
        shell: bash
        run: sfw pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      # wrangler.jsonc の構文とbindingsを、デプロイせずに検証する。
      - name: Validate Worker configuration
        run: pnpm wrangler deploy --dry-run
